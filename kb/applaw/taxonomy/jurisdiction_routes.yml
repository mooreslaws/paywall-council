- id: uk-pressure
  jurisdiction: "UK"
  sub_jurisdiction: null
  pattern_ids: [urgency-timer, discount-pressure, discount-wheel, discount-anchoring, task-sunk-cost, pseudo-gifts, fake-promo-code-countdown, fake-installs-purchases]
  candidate_norms: [uk-dmcc-225, uk-dmcc-226]
  required_facts: [uk-directed-consumer-commercial-practice, false-or-unverifiable-scarcity-or-time-claim]
  disqualifying_facts: [genuine-time-limited-offer-substantiated]
  source_anchor_ids: [norm:uk-dmcc-225, outcome:uk-cma-emma-sleep-2026]
  condition: "Use only when the pressure representation is false or unverifiable as presented (a countdown that resets or outlives its deadline, a perpetual discount, an unsubstantiated scarcity claim, a live install, purchase, viewer or active-user counter presented as real demand) and is likely to affect a transactional decision. Emma Sleep anchors false timers, specified discount claims and false high-demand messaging. A timer alone, a counter sourced to a named analytics platform with a stated update date, or pressure that reflects a genuine substantiated limit, is insufficient. A claim about what the product will do for the consumer belongs to uk-unsubstantiated-objective-claim. A discount presented as won, exclusive, or personally selected carries no time or quantity claim, so this route's required fact can never be established on it; that representation belongs to no route yet in this knowledge base, and any Section 226 overall-presentation reasoning about a forced winning discount must be run there and never from this route, whose facts cannot support it."

- id: eu-pressure
  jurisdiction: "EU"
  sub_jurisdiction: null
  pattern_ids: [urgency-timer, discount-pressure, discount-wheel, discount-anchoring, task-sunk-cost, pseudo-gifts, fake-promo-code-countdown, fake-installs-purchases]
  candidate_norms: [eu-ucpd-5-9]
  required_facts: [pre-contract-stage, false-or-unverifiable-scarcity-or-time-claim]
  disqualifying_facts: [genuine-time-limited-offer-substantiated]
  source_anchor_ids: [norm:eu-ucpd-5-9, outcome:eu-cpc-booking-commitment-2020]
  condition: "Use only when the pressure representation is false or unverifiable as presented and materially affects a transactional decision. A live install, purchase, viewer or active-user counter presented as real demand is such a representation; a counter sourced to a named analytics platform with a stated update date is not, and a claim about what the product will do for the consumer belongs to eu-unsubstantiated-objective-claim. The Booking.com CPC matter is a no-finding commitment and corrective-design example for scarcity and urgency presentation, never an enforcement benchmark or finding of infringement. A discount presented as won, exclusive, or personally selected is a representation about chance or exclusivity, not a countdown, stock warning, demand counter or limited-offer claim, so this route's required fact can never be established on it; it belongs to no route yet in this knowledge base."

- id: eu-cancellation-obstruction
  jurisdiction: "EU"
  sub_jurisdiction: null
