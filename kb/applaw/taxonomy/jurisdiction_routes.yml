  condition: "Use only where an invitation to purchase requests a payment commitment (billing details, a pay-now or subscribe action) while a material pricing term is omitted or materially subordinated at that point. Section 225 requires the practice to be likely to cause the average consumer to take a different transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

- id: eu-payment-disclosure
  jurisdiction: "EU"
  sub_jurisdiction: null
  pattern_ids: [payment-without-renewal-disclosure, payment-without-clear-disclosure, no-price-upsell]
  candidate_norms: [eu-ucpd-5-9, eu-crd-6, eu-crd-8-2]
  required_facts: [covered-distance-or-off-premises-contract, payment-commitment-requested, material-pricing-term-omitted-or-subordinated-at-invitation]
  disqualifying_facts: [full-charge-and-cadence-equally-prominent]
  source_anchor_ids: [norm:eu-ucpd-5-9, norm:eu-crd-6, norm:eu-crd-8-2, outcome:eu-cjeu-fuhrmann-2022]
  condition: "Use only for a covered distance contract where a payment commitment is requested while a material pricing term is omitted or subordinated. CRD Article 8(2) applies specifically to the ordering step and its payment-obligation labeling; Fuhrmann-2 anchors the button-wording consequence. Member State implementation limits are preserved. Article 5(2)(b) requires the practice to materially distort the average consumer's transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

