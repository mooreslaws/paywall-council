  disqualifying_facts: [cancellation-comparable-to-signup, ordinary-identity-or-fraud-check-only]
  source_anchor_ids: [norm:eu-ucpd-5-9, outcome:eu-cpc-amazon-prime-commitment-2022]
  condition: "Use only for material obstruction affecting a consumer's cancellation decision. The Amazon Prime CPC matter is a no-finding commitment and corrective-design example, never an enforcement benchmark or finding of infringement. Article 5(2)(b) requires the practice to materially distort the average consumer's transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

- id: uk-cancellation-obstruction
  jurisdiction: "UK"
  sub_jurisdiction: null
  pattern_ids: [hard-cancellation, asymmetric-cancellation-path]
  candidate_norms: [uk-dmcc-228]
  required_facts: [uk-directed-consumer-commercial-practice, trader-to-consumer-contract, existing-consumer-cancellation-right, post-contract-cancellation-stage, onerous-or-disproportionate-action-to-exercise-right, harassment-coercion-or-undue-influence, likely-different-transactional-decision]
  disqualifying_facts: [cancellation-comparable-to-signup, ordinary-identity-or-fraud-check-only, minor-neutral-confirmation-steps-only, no-consumer-cancellation-right-at-that-stage, business-to-business-transaction]
  source_anchor_ids: [norm:uk-dmcc-228]
  condition: "Use only for a UK-directed consumer practice where a trader subjects an existing cancellation right to onerous or disproportionate action that, in context, amounts to harassment, coercion, or undue influence and is likely to alter retention, withdrawal, or exercise of a contractual right. Section 228(2)(f) is a factor, not a standalone prohibition. CMA207's repeated-confirmation termination example supplies the reasoning anchor. Do not rely on generic friction, ordinary checks, or the uncommenced Section 260 subscription rule."

- id: uk-confirmed-fabricated-reviews
  jurisdiction: "UK"
  sub_jurisdiction: null
  pattern_ids: [fake-social-media-reviews]
  candidate_norms: [uk-dmcc-sch20-13]
  required_facts: [uk-directed-consumer-commercial-practice, consumer-review-or-review-information, trader-submitted-commissioned-or-published-review, local-authoritative-source-establishes-fabrication]
  disqualifying_facts: [source-information-absent, suspicious-but-not-determined, ordinary-rating-or-testimonial-without-fabrication-evidence, business-to-business-transaction]
  source_anchor_ids: [norm:uk-dmcc-sch20-13]
  condition: "Use only when reviewed evidence establishes both fabrication and the trader's paragraph 13 conduct. A missing review link, an ordinary rating, duplicated-looking language, a static screenshot of a platform widget, or other suspicion does not establish a fake review. CMA208's investigation guidance supplies the reasoning boundary: suspicious content remains unconfirmed until evidence supports a determination, and genuine reviews must not be treated as fake because their presentation invites doubt. Paragraph 13 is a listed practice under Section 225(4)(c) and is unfair in all circumstances, so no separate proof that the display affected a transactional decision is required; that absence is not a licence to reach the fabrication conclusion on weaker evidence. Reviews carrying a third-party platform's attribution, and reviews whose origin the screen does not state, fall outside the trader-conduct gate as it is written and reach no finding on this route; unresolved authenticity is Unverified social proof, never a paragraph 13 accusation. Publisher-system duties require their own facts and are not inferred from one suspicious review."

# --- First-party claims, defaults and post-purchase obstruction -------------
# Thirty-seven of the taxonomy's sixty-eight patterns reached no route at all,
# and every one of them mapped only to US norms, so a claim-heavy funnel sold
# into the EU and the UK produced a US-only slice. Across the traced waves that
# was 52% of everything the Examiner selected, and Counsel either hedged or
# reached for the obvious European instrument and lost the whole report to the
# validator.
#
# These routes cover only the trader's OWN claims. Third-party attributions -
# reviews, ratings, awards, media features, endorsements, install counts - stay
# with the existing reviews routes and their deliberate abstention: suspicion
# about someone else's words is not a determination that they are fabricated,
# and nothing here may be used to reach that conclusion.

- id: us-unsubstantiated-objective-claim
  jurisdiction: "US"
  sub_jurisdiction: null
  pattern_ids: [outcome-promise, outcome-teaser, tailored-plan-claim, health-adjacent-claim, misused-scientific-evidence, free-claim, money-back-misdirection, fake-analysis, false-personalization, fake-predictive-progress-graphs, fake-awards, fake-media-features, fake-university-endorsement, authority-claim, before-after-social-proof]
  candidate_norms: [us-ftc-5a]
  required_facts: [objective-claim-presented-as-fact, claim-substantiation-absent-on-screen]
  disqualifying_facts: [claim-substantiation-or-source-shown, claim-framed-as-individual-experience-or-opinion]
  source_anchor_ids: [norm:us-ftc-5a, outcome:us-ftc-nutraclick-2020]
  condition: "Use Section 5(a) for the trader's own objective performance, personalization, or guarantee claim presented as fact where the screen shows no substantiation and the claim can affect a purchase decision. A visibly qualified claim, an opinion, or an individually framed testimonial is not covered. This is the general deception prohibition and never establishes that a third party's review or endorsement is fabricated."

- id: eu-unsubstantiated-objective-claim
