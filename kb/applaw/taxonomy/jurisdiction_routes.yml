- id: uk-disclosure-price
  jurisdiction: "UK"
  sub_jurisdiction: null
  pattern_ids: [hidden-renewal, delayed-price-disclosure, small-print-renewal, below-fold-disclosure, one-time-price-framing, trial-framing, trial-price-framing, misleading-trial-period, personalization-lure, hidden-upsell-subscription]
  candidate_norms: [uk-dmcc-225, uk-dmcc-230]
  required_facts: [invitation-to-purchase, material-pricing-term-omitted-or-subordinated-at-invitation]
  disqualifying_facts: [full-charge-and-cadence-equally-prominent]
  source_anchor_ids: [norm:uk-dmcc-225, norm:uk-dmcc-230, outcome:uk-cma-aa-bsm-2026]
  condition: "Use only for an invitation to purchase where a material pricing term (total price, renewal price, billing cadence, or trial-conversion terms) is omitted, below the fold, or materially less prominent than the promoted price, and the omission is likely to affect a transactional decision. The omission is assessed on the invitation to purchase itself: an upstream screen that carries no offer does not engage Section 230, and a funnel is not caught because an earlier step withheld a price that the paywall then states in full. So an email gate or other price-deferral screen is not reached on this route, and nothing in this knowledge base reaches a UK price-deferral screen at all: the limb that would reach a funnel-level omission is not in norms.yml and may not be substituted for Section 230. The AA/BSM final notice anchors delayed price disclosure; it does not make every layout choice unlawful. The route reaches an add-on offered as a one-off whose recurring price, cadence or cancellation terms are smaller, fainter or further away than the control that adds it, including a post-purchase add-on, because that screen itself names a product and a price and offers a way to buy it and is therefore its own invitation to purchase. A personalisation quiz, assessment, profile, or reading reaches this route only through the invitation to purchase it leads to: a quiz screen that names no price is not itself an invitation to purchase, so the test is whether the total price, renewal price, or cadence is still omitted or subordinated at the offer that follows. Effort invested in answering questions is not by itself an omission, and a quiz that opens onto a paywall showing the charge and cadence at equal prominence does not activate this route. An add-on whose price, cadence and cancellation terms are legible before acceptance does not activate it either. A stated renewal price that contradicts the plan the consumer selected is a misleading action under Section 226 rather than a Section 230 omission and does not belong on this route."

- id: eu-disclosure-price
  jurisdiction: "EU"
  sub_jurisdiction: null
  pattern_ids: [hidden-renewal, delayed-price-disclosure, small-print-renewal, below-fold-disclosure, one-time-price-framing, trial-framing, trial-price-framing, misleading-trial-period, personalization-lure]
  candidate_norms: [eu-ucpd-5-9, eu-crd-6]
  required_facts: [covered-distance-or-off-premises-contract, pre-contract-stage, material-pricing-term-omitted-or-subordinated-at-invitation]
  disqualifying_facts: [full-charge-and-cadence-equally-prominent]
  source_anchor_ids: [norm:eu-ucpd-5-9, norm:eu-crd-6, outcome:eu-cjeu-canal-digital-2016]
  condition: "Use only for a covered distance or off-premises contract, before the contract is concluded, where a material pricing term is omitted or materially subordinated and the omission is likely to cause the average consumer to take a transactional decision they would not otherwise have taken. Canal Digital anchors prominent total-price presentation; Member State transposition and remedy limits are preserved. A personalisation quiz, assessment, profile, or reading reaches this route only through the offer it leads to: the question is whether the total price, renewal price, or cadence is still omitted or subordinated when the contract is proposed, not that the consumer answered questions first. A quiz that opens onto a screen showing the charge and its cadence at equal prominence does not activate this route. Article 5(2)(b) requires the practice to materially distort the average consumer's transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

- id: uk-price-framing
  jurisdiction: "UK"
  sub_jurisdiction: null
  pattern_ids: [daily-price-framing, nominal-price-framing]
  candidate_norms: [uk-dmcc-225, uk-dmcc-230]
  required_facts: [invitation-to-purchase, recurring-or-total-price-less-prominent]
  disqualifying_facts: [full-charge-and-cadence-equally-prominent]
  source_anchor_ids: [norm:uk-dmcc-225, norm:uk-dmcc-230, outcome:uk-cma-aa-bsm-2026, case:uk_aa_bsm/lesson-package-selection-40]
  condition: "Use only when a UK invitation to purchase subordinates a reasonably calculable total or recurring price. The AA/BSM final notice is a total-price presentation anchor, not proof that every daily or introductory price is unlawful. Section 225 requires the practice to be likely to cause the average consumer to take a different transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

- id: eu-price-framing
  jurisdiction: "EU"
  sub_jurisdiction: null
  pattern_ids: [daily-price-framing, nominal-price-framing]
  candidate_norms: [eu-ucpd-5-9, eu-crd-6]
  required_facts: [covered-distance-or-off-premises-contract, pre-contract-stage, recurring-or-total-price-less-prominent]
  disqualifying_facts: [full-charge-and-cadence-equally-prominent]
  source_anchor_ids: [norm:eu-ucpd-5-9, norm:eu-crd-6, outcome:eu-cjeu-canal-digital-2016]
  condition: "Use only when material total or recurring price information is subordinated before a covered contract. Canal Digital supports prominent total-price analysis; Member State implementation and remedies remain separate. Article 5(2)(b) requires the practice to materially distort the average consumer's transactional decision, and the finding must reason that element from what is on the screen rather than assume it."

- id: uk-payment-disclosure
  jurisdiction: "UK"
  sub_jurisdiction: null
