- id: us-online-negative-option-disclosure
  jurisdiction: "US"
  sub_jurisdiction: null
  pattern_ids: [hidden-renewal, delayed-price-disclosure, small-print-renewal, renewal-price-mismatch, below-fold-disclosure, daily-price-framing, nominal-price-framing, one-time-price-framing, trial-framing, trial-price-framing, misleading-trial-period, payment-without-renewal-disclosure, payment-without-clear-disclosure, email-before-price, hidden-upsell-subscription, no-price-upsell, personalization-lure, name-your-price]
  candidate_norms: [us-rosca-4-1]
  required_facts: [covered-online-negative-option-transaction, billing-information-requested-in-flow, negative-option-terms-omitted-or-subordinated-at-billing-point]
  disqualifying_facts: [negative-option-terms-clearly-and-conspicuously-disclosed-before-billing]
  source_anchor_ids: [norm:us-rosca-4-1]
  condition: "Use ROSCA Section 4(1) only for a covered online negative-option transaction where the reviewed flow requests billing information and the material negative-option terms (renewal price, billing cadence, or trial-conversion timing) are absent, below the fold, or materially less prominent than the purchase action at or before that point. Each element is observed separately; the disclosure conclusion is composed from them, never demanded as a single input. A recurring-looking visual cue alone is insufficient. A personalisation quiz, assessment, profile, or reading placed ahead of the price, and a step inviting the consumer to name a comfortable starting amount, reach this route only through the same test: what matters is not that effort or a chosen figure came first, but that the renewal price, cadence, or conversion timing is still absent or subordinated when billing information is requested. The amount the consumer names is not itself the disclosure of what will be charged later. A quiz or chosen-price step that ends on a screen stating the recurring charge and its cadence in prominence comparable to the promoted figure does not activate this route."

- id: us-covered-ticket-or-lodging-fee
  jurisdiction: "US"
  sub_jurisdiction: null
  pattern_ids: [mandatory-fee-drip-pricing]
  candidate_norms: [us-ftc-fees-rule]
  required_facts: [covered-live-event-ticket-or-short-term-lodging-offer]
  source_anchor_ids: [norm:us-ftc-fees-rule]
  condition: "Use Part 464 only for covered live-event ticket or short-term lodging offers. A processing, delivery, service, booking, or platform fee in any other sector does not activate this rule."

- id: us-supported-review-rule-conduct
