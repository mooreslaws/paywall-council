  disqualifying_facts: [claim-substantiation-or-source-shown, claim-framed-as-individual-experience-or-opinion, business-to-business-transaction]
  source_anchor_ids: [norm:uk-dmcc-225, outcome:uk-cma-emma-sleep-2026]
  condition: "Use Section 225's misleading-action limb for the trader's own objective claim presented as fact with no substantiation on screen, where the practice is UK-directed and likely to alter a transactional decision. Emma Sleep anchors unsubstantiated claim presentation. Schedule 20 paragraph 13 remains the only route for fabricated reviews and requires its own established facts."

- id: eu-default-selection-consent
  jurisdiction: "EU"
  sub_jurisdiction: null
  pattern_ids: [preselected-plan, missing-express-consent, single-option-cta, one-click-upsell]
  candidate_norms: [eu-ucpd-5-9]
